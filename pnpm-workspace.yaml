allowBuilds:
  better-sqlite3: set this to true or false
  esbuild: true
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@types/node@24.19.1'
# The home server's link can be slow (the next and swc tarballs are big); pnpm's 60 s default aborted the image build.
fetchTimeout: 600000
fetchRetries: 5
patchedDependencies:
  recharts@3.10.1: patches/recharts@3.10.1.patch
